<body>
    <!-- Google Tag Manager (noscript) -->

    <h1><a href="index.html">방준호의 브런치</a></h1>
    <textarea id="prompt" rows="10" cols="80" placeholder="요청 내용을 입력하세요"></textarea>
    <br>
    <button id="generate">생성하기</button>
    <pre id="result"></pre>

    <script>
    document.getElementById('generate').addEventListener('click', async () => {
        const prompt = document.getElementById('prompt').value;
        const res = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${OPENAI_API_KEY}` // 서버에서 주입된 키 사용
            },
            body: JSON.stringify({
                model: 'gpt-3.5-turbo',
                messages: [{ role: 'user', content: prompt }]
            })
        });
        const data = await res.json();
        document.getElementById('result').textContent = data.choices[0].message.content;
    });
    </script>
</body>
